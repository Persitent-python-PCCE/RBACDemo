{% extends "base.html" %}

{% block title %}Register User - RBAC Demo{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus text-info display-4 mb-2"></i>
                <h3 class="fw-bold text-white">Create an Account</h3>
                <p class="text-secondary">Register with a specific role to test RBAC permissions</p>
            </div>

            <form action="{{ url_for('auth.web_register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label text-white fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" placeholder="e.g. alice_admin" required autocomplete="off">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-white fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label text-white fw-semibold">Assign Role</label>
                    <select class="form-select bg-dark text-white border-secondary" id="role" name="role" required>
                        <option value="USER" selected>USER (Read-only students list)</option>
                        <option value="STUDENT">STUDENT (Read-only students list)</option>
                        <option value="TEACHER">TEACHER (Can view, add & edit students)</option>
                        <option value="ADMIN">ADMIN (Full access: view, add, edit & delete students)</option>
                    </select>
                    <div class="form-text text-secondary mt-1">
                        Select a role to test backend authorization logic.
                    </div>
                </div>

                <button type="submit" class="btn btn-info btn-lg w-100 fw-bold text-dark mb-3">
                    <i class="fa-solid fa-check-circle me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary">
                <span class="text-secondary">Already have an account?</span>
                <a href="{{ url_for('auth.web_login') }}" class="text-info text-decoration-none fw-semibold ms-1">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
