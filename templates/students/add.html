{% extends "base.html" %}

{% block title %}Add Student - RBAC Demo{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
                <a href="{{ url_for('student.web_list_students') }}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h3 class="fw-bold text-white mb-0">Add New Student</h3>
                    <small class="text-info">Protected Route: ADMIN & TEACHER roles only</small>
                </div>
            </div>

            <form action="{{ url_for('student.web_add_student') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label text-white fw-semibold">Full Name</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="name" name="name" placeholder="e.g. John Doe" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-white fw-semibold">Email Address</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" placeholder="e.g. john@example.com" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="age" class="form-label text-white fw-semibold">Age</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary" id="age" name="age" min="1" max="120" placeholder="e.g. 21" required>
                    </div>

                    <div class="col-md-6">
                        <label for="course" class="form-label text-white fw-semibold">Course / Major</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="course" name="course" placeholder="e.g. Computer Science" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                    <a href="{{ url_for('student.web_list_students') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-info btn-custom-primary fw-bold px-4">
                        <i class="fa-solid fa-save me-1"></i> Save Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
